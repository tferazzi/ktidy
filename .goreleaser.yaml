version: 2

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: tferazzi
      name: homebrew-ktidy
    homepage: https://github.com/tferazzi/ktidy
    description: Merge, split, import, export, and group kubeconfig files
